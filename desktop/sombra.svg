<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <!-- Spans the plate in user space, so the band that holds the cloud off the
         sun can be filled with it and land on the colour the plate has there.
         Measured from the shape it fills, a second gradient would start over
         inside the cloud. -->
    <linearGradient id="tile" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="256" y2="256">
      <stop offset="0" stop-color="#608cc8"/>
      <stop offset="1" stop-color="#203460"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="256" height="256" rx="56" ry="56" fill="url(#tile)"/>
  <line x1="195.1" y1="134.5" x2="217.3" y2="143.7" stroke="#ffd666" stroke-width="12" stroke-linecap="round"/>
  <line x1="160.5" y1="169.1" x2="169.7" y2="191.3" stroke="#ffd666" stroke-width="12" stroke-linecap="round"/>
  <line x1="111.5" y1="169.1" x2="102.3" y2="191.3" stroke="#ffd666" stroke-width="12" stroke-linecap="round"/>
  <line x1="76.9" y1="134.5" x2="54.7" y2="143.7" stroke="#ffd666" stroke-width="12" stroke-linecap="round"/>
  <line x1="76.9" y1="85.5" x2="54.7" y2="76.3" stroke="#ffd666" stroke-width="12" stroke-linecap="round"/>
  <line x1="111.5" y1="50.9" x2="102.3" y2="28.7" stroke="#ffd666" stroke-width="12" stroke-linecap="round"/>
  <line x1="160.5" y1="50.9" x2="169.7" y2="28.7" stroke="#ffd666" stroke-width="12" stroke-linecap="round"/>
  <line x1="195.1" y1="85.5" x2="217.3" y2="76.3" stroke="#ffd666" stroke-width="12" stroke-linecap="round"/>
  <circle cx="136" cy="110" r="54" fill="#ffd666"/>
  <g fill="url(#tile)">
