<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  Who may own the name, and who may talk to it.

  The pattern is the one colord, UPower, fwupd and logind use on this machine:
  root owns the name, anybody may call and anybody may listen, and the decision
  about a caller is polkit's rather than the bus's. A group in this file would be a
  second answer to the same question, and the group is exactly what this daemon
  stopped needing.

  Listening is a line of its own. Without `receive_sender` a client connects, calls
  methods and never receives a single PropertiesChanged, which looks like everything
  working and nothing updating.
-->
<busconfig>
  <policy user="root">
    <allow own="io.github.svesh87.Sombra"/>
  </policy>

  <policy context="default">
    <allow send_destination="io.github.svesh87.Sombra"/>
    <allow receive_sender="io.github.svesh87.Sombra"/>
  </policy>
</busconfig>
