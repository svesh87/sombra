# Mode and brightness definitions for ombrad.
#
# This file is the single source of truth for durable mode definitions. The
# daemon reads it and never writes it, so the comments below survive; the
# selected mode lives in a separate state file. Changes are picked up without
# a restart.
#
# The numbers here are tuned by analysing recorded telemetry, which is why they
# live in a text file rather than behind a dialog: a script can edit this, and
# cannot operate a settings window.
#
# Units and ranges:
#   platform_profile     quiet | balanced | performance
#                        Selects the EC fan curve. This is the noise-versus-
#                        temperature dial, and it is chosen per mode: at
#                        identical power settings under sustained load the
#                        curves separate cleanly, while at idle the choice makes
#                        no difference at all.
#   pl1_w                RAPL long-term power limit, watts. The most effective
#                        control for sustained load. Capped at the highest value
#                        confirmed on this machine; a larger number is clamped
#                        and reported in the log.
#   pl2_w                RAPL short-term power limit, watts.
#   max_perf_pct         intel_pstate frequency ceiling, 8..100.
#   turbo                on | off
#   epp                  energy_performance_preference: default, performance,
#                        balance_performance, balance_power, power. Together
#                        with hwp_dynamic_boost this is what suppresses the
#                        short bursts that heat the package while the machine is
#                        nominally idle. No vendor profile touches either.
#   hwp_dynamic_boost    0 | 1
#   gt_max_mhz           iGPU frequency ceiling, 100..2350. A video call loads
#                        the graphics engine as heavily as the cores, and none
#                        of the CPU-side controls affect that.
#
# The fan is deliberately not a mode parameter. Full speed is reachable only by
# explicit command and by the emergency thermal guard, never by automatic
# control.

[general]
# Applied at boot. The middle mode is the working one: the machine spends the
# overwhelming majority of its time there, and it is what telemetry tuning
# targets. The other two are edge cases.
default_mode=work

# The brightness profile below. Following the ambient light sensor is a
# separate function from the thermal mode, with its own profile and its own
# switch; selecting a mode never moves the backlight. The automation itself is
# off until it is switched on, and that choice survives a reboot.
default_brightness_profile=indoors

[mode quiet]
label=Quiet
platform_profile=quiet
pl1_w=12
pl2_w=20
max_perf_pct=40
turbo=off
epp=power
hwp_dynamic_boost=0
gt_max_mhz=1000

[mode work]
label=Work
platform_profile=balanced
pl1_w=20
pl2_w=30
max_perf_pct=50
turbo=off
epp=power
hwp_dynamic_boost=0
gt_max_mhz=2350

[mode full]
label=Full
platform_profile=balanced
pl1_w=45
pl2_w=65
max_perf_pct=100
turbo=on
epp=balance_performance
hwp_dynamic_boost=1
gt_max_mhz=2350

# Brightness profiles.
#
# A separate list with a separate selection, sharing this file and nothing
# else with the modes above. The level the person set is the baseline and the
# automation works in a window around it; the bounds constrain the automation,
# never the person.
#
#   span_pct     How far the automation may wander from that baseline, in
#                percentage points of the panel scale, symmetrically. With a
#                baseline of 80 and a span of 10 the automation works in
#                70..90.
#   floor_pct    Absolute bounds. They cut the window rather than moving it: a
#   ceiling_pct  baseline of 90 with a span of 10 and a ceiling of 95 gives
#                80..95, not 85..95. The floor is about legibility — a screen
#                the automation drove into unreadable is a failure, not a
#                saving. The ceiling is about a sensor at a sunlit window
#                asking for a maximum that both dazzles and heats.
#   curve        light:position pairs. The reading is the ambient sensor's own
#                units, NOT lux: the driver's scale lands two orders of
#                magnitude below a light meter and nothing here corrects for
#                that. The position is where in the window that reading puts
#                the backlight, 0 at the bottom of the window and 100 at the
#                top, interpolated linearly and flat beyond the ends. Choosing
#                a point inside the window, rather than an absolute level the
#                window then clamps, is what makes a narrow span move less
#                instead of pinning the backlight to an edge.
#
# The readings below are a starting point set by eye on one machine. Record an
# hour of telemetry and read the `light` column against the room before
# trusting them.
#
# The automation moves in coarse steps, with hysteresis at their boundaries, a
# dwell before acting and a fade rather than a jump. Those four are constants
# in the code rather than settings here: they are what keeps the backlight from
# visibly hunting, which is a defect rather than a matter of taste.

[brightness indoors]
label=Indoors
span_pct=10
floor_pct=5
ceiling_pct=100
curve=0:0, 500:20, 1500:45, 3000:75, 6000:100
